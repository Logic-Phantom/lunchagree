# 공공데이터 주간 빌드 → GitHub Pages(음식점 격자 타일 /v1/tiles/{i}_{j}.json)
# 패턴: StrangeRecords/FactBokAI의 예약 Actions(cron + workflow_dispatch), TechLog의 Pages 배포.
# 시·도 16개를 병렬 작업으로 나눠 받는다(한 작업 6시간 제한·하루 호출 한도 10,000회 안쪽, D-043).
# 하나라도 실패하면 배포하지 않으므로 이전 Pages 산출물이 그대로 유지된다(fail-closed).
#
# 필요한 것(사용자 할 일 — README §사용자가 직접 할 일)
#   - Repository secret   DATA_GO_KR_KEY       : data.go.kr '행정안전부_식품_일반음식점 조회서비스'(15154916) 일반 인증키(Decoding). 커밋 금지.
#   - Repository variable RESTAURANT_OPEN_CODE : 영업상태코드 '01'(2026-10-31 --probe 확인)
#   - Settings → Pages → Source: GitHub Actions
name: Data Build

on:
  schedule:
    # 매주 월요일 03:17 KST (정각 혼잡 회피)
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "$DATA_GO_KR_KEY" ] && [ -n "$OPEN_CODE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DATA_GO_KR_KEY 또는 RESTAURANT_OPEN_CODE가 없어 빌드를 건너뜀. 이전 Pages 산출물 유지."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          OPEN_CODE: ${{ vars.RESTAURANT_OPEN_CODE }}

  fetch:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false # 한 지역의 일시 오류로 나머지가 취소되지 않게(실패한 지역만 'Re-run failed jobs')
      max-parallel: 6 # API에 한꺼번에 몰리지 않게
      matrix:
        # data-build/src/fetch-api.ts SIDO와 같게(2026-10-31 확인: 광주·전남 → 전남광주통합특별시)
        sido: [서울특별시, 부산광역시, 대구광역시, 인천광역시, 대전광역시, 울산광역시, 세종특별자치시, 경기도, 강원특별자치도, 충청북도, 충청남도, 전북특별자치도, 전남광주통합특별시, 경상북도, 경상남도, 제주특별자치도]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 수집(영업 중만)
        run: npm run fetch:api --workspace data-build -- --open-code "$OPEN_CODE" --regions "${{ matrix.sido }}" --date run
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          OPEN_CODE: ${{ vars.RESTAURANT_OPEN_CODE }}
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ strategy.job-index }}
          path: data-build/raw/15154916_일반음식점_run/*.ndjson
          retention-days: 3

  build:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test --workspace data-build
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          merge-multiple: true
          path: data-build/raw/15154916_일반음식점_run
      - name: 기준일 폴더 이름 맞추기
        run: mv "data-build/raw/15154916_일반음식점_run" "data-build/raw/15154916_일반음식점_$(TZ=Asia/Seoul date +%Y%m%d)"
      - name: 좌표계 검증 + 타일 빌드
        run: |
          npm run verify:crs --workspace data-build
          npm run data:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data-build/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
